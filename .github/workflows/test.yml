# 月齢の計算（moon.py）のテストを、push とプルリクエストのたびに回す。
# moon.py は標準ライブラリだけで動くので、依存のインストールは要らない
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 月齢の計算のテスト
        run: python -m unittest discover -s tests -v
